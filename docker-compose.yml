# Netra — local production-like stack.  `make up`  then open https://localhost:8443
name: netra

x-backend-env: &backend-env
  DATABASE_URL: mysql+aiomysql://netra:${MYSQL_PASSWORD}@mysql:3306/netra?charset=utf8mb4
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  CREDENTIALS_KEY: ${CREDENTIALS_KEY}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
  VIEWER_PASSWORD: ${VIEWER_PASSWORD}
  SEED_API_KEY: ${SEED_API_KEY}
  CAMSIM_PASSWORD: ${CAMSIM_PASSWORD}
  ONVIF_PASSWORD: ${ONVIF_PASSWORD}
  VENDOR_API_KEY: ${VENDOR_API_KEY}
  PUBLIC_HLS_URL: ${PUBLIC_HLS_URL:-https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8}
  GATEWAY_API_URL: http://gateway:9997
  GATEWAY_API_SECRET: ${GATEWAY_API_SECRET}
  ONVIF_DISCOVERY_HOSTS: http://simulator:8081/onvif/device_service
  CORS_ORIGINS: https://localhost:${HTTPS_PORT:-8443},http://localhost:5173
  ENVIRONMENT: ${ENVIRONMENT:-development}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  PROBE_TIMEOUT_S: "6"
  PROBE_SLOW_THRESHOLD_S: "3"
  TZ: UTC

# Least privilege for every container
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Bounded container logs (json-file grows forever otherwise)
x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  mysql:
    <<: *logging
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: netra
      MYSQL_USER: netra
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Single server: no binary logs (they would otherwise grow for 30 days); modest buffer pool
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-log-bin
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u netra -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    restart: unless-stopped

  redis:
    <<: *logging
    mem_limit: 320m
    security_opt: ["no-new-privileges:true"]
    image: redis:7.4-alpine
    # Memory cap: only keys with a TTL (dedup windows, rate limits, locks) may be evicted,
    # never the ingest stream; streams are length-capped by their producers
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    networks: [data]
    restart: unless-stopped

  backend:
    <<: [*logging, *hardened]
    mem_limit: 768m
    build: ./backend
    environment: *backend-env
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]   # direct API access for local debugging only
    networks: [data, app, cameras]
    restart: unless-stopped

  gateway:
    <<: [*logging, *hardened]
    mem_limit: 512m
    image: bluenviron/mediamtx:1
    volumes:
      - ./infra/gateway/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:   # WebRTC media (UDP, TCP fallback); local-only by default like the web port
      - "${BIND_ADDRESS:-127.0.0.1}:8189:8189/udp"
      - "${BIND_ADDRESS:-127.0.0.1}:8189:8189/tcp"
    networks: [app, cameras]
    restart: unless-stopped

  camsim:
    <<: [*logging, *hardened]
    mem_limit: 768m
    build: ./infra/camsim
    environment:
      CAMSIM_USER: viewer
      CAMSIM_PASSWORD: ${CAMSIM_PASSWORD}
      ONVIF_PASSWORD: ${ONVIF_PASSWORD}
      TZ: Asia/Kolkata
    volumes: ["./samples:/samples:ro"]
    networks: [cameras]
    restart: unless-stopped

  simulator:
    <<: [*logging, *hardened]
    mem_limit: 384m
    build: ./simulator
    environment:
      NETRA_API_URL: http://backend:8000/api/v1
      SEED_API_KEY: ${SEED_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ONVIF_PASSWORD: ${ONVIF_PASSWORD}
      CAMSIM_PASSWORD: ${CAMSIM_PASSWORD}
      ONVIF_STREAM_URI: rtsp://camsim:8554/c003
      VENDOR_API_KEY: ${VENDOR_API_KEY}
      VENDOR_BASE: http://localhost:8090
      INGEST_MODE: ${INGEST_MODE:-mixed}
      SIM_EVENTS_PER_MIN: ${SIM_EVENTS_PER_MIN:-20}
      TZ: Asia/Kolkata
    depends_on:
      backend: {condition: service_healthy}
    networks: [data, app, cameras]
    restart: unless-stopped

  web:
    <<: [*logging, *hardened]
    mem_limit: 256m
    cap_add: [NET_BIND_SERVICE]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      EXTERNAL_MEDIA_ORIGINS: ${EXTERNAL_MEDIA_ORIGINS:-https://test-streams.mux.dev}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    # Local-only by default; set BIND_ADDRESS=0.0.0.0 to serve other machines (e.g. a hosted demo)
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"]
    volumes: [caddy-data:/data]
    depends_on: [backend, gateway]
    networks: [app]
    restart: unless-stopped

  prometheus:
    <<: [*logging, *hardened]
    mem_limit: 512m
    profiles: [observability]
    image: prom/prometheus:v3.4.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [app]

networks:
  data: {}      # MySQL / Redis: never exposed publicly
  app: {}       # edge proxy <-> API / gateway
  cameras: {}   # camera VLAN analogue: only the gateway, backend probes and simulators

volumes:
  mysql-data: {}
  redis-data: {}
  caddy-data: {}
  recordings: {}
